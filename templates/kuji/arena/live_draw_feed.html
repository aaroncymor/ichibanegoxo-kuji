<div class="rounded-2xl bg-[#0f1624] border border-slate-800 p-4 shadow-lg">

    <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-xs font-display font-bold text-white uppercase tracking-wider">
                LIVE DRAW FEED
            </span>
        </div>
        <span class="text-[10px] font-mono text-slate-400">
            Instant Chain Sync
        </span>
    </div>

    <div class="space-y-2.5 max-h-56 overflow-y-auto pr-1">
        {% for prize in claimed_raffles %}
        <div
            class="p-2.5 rounded-lg bg-[#121826] border border-slate-800/80 flex items-center justify-between gap-3 text-xs">
            <div class="flex items-center gap-2.5">
                <div
                    class="w-7 h-7 rounded-full bg-slate-800 text-slate-300 font-mono text-[10px] font-bold flex items-center justify-center shrink-0 border border-slate-700">
                    AC
                </div>
                <div>
                    <div class="text-xs font-bold text-white flex items-center gap-1.5">
                        <span>User @aaroncymor</span>
                        <span class="text-[10px] font-normal text-slate-400">
                            drew 5 tickets
                        </span>
                    </div>
                    <div class="flex flex-wrap items-center gap-1.5 mt-1">
                        {% for prize_won in prize.prizes_won %}
                        <span class="text-[9px] font-mono font-bold px-1.5 py-0.2 rounded">
                            A
                        </span>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <div class="text-right shrink-0 font-mono text-[10px] text-slate-400">
                2m ago
            </div>
        </div>
        {% empty %}
        <div class="text-xs text-slate-400">
            No draws yet
        </div>
        {% endfor %}
    </div>

</div>
