{% extends 'base.html' %}

{% block content %}
    <div class="flex flex-col justify-center">
        <ul class="list-style-none">
            {% for kuji_session in kuji_sessions %}
                <li>
                    <a href="{% url 'kuji_detail_new' kuji_session.id %}" target="_blank">
                        {{ kuji_session.title }}
                    </a>
                </li>
            {% empty %}
                <li>
                    <span class="font-bold">No kuji sessions retrieved.</span>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
