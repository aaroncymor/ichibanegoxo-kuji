{% load django_htmx %}
{% load static tailwind_tags %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Ichiban Kuji</title>
  {% tailwind_css %}
  {% htmx_script version=4 extensions="hx-sse,hx-ws" %}
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  {% block extra_head %}{% endblock %}
</head>

<body class="bg-[#080b12] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200 min-h-screen"
  hx-headers:inherited='{"x-csrftoken": "{{ csrf_token }}"}'>
  <main>
    <!-- Header -->
    <header
      class="sticky top-0 z-50 bg-[#0a0e17]/95 backdrop-blur-md border-b border-slate-800/80 px-4 lg:px-6 py-2.5 transition-colors"
      x-data="{activeTab: 'marketplace', isStudioOpen: false}">
      <div class="max-w-[1600px] mx-auto flex items-center justify-between gap-3 lg:gap-6">

        <!-- Brand Zone -->
        <div class="flex items-center gap-3 shrink-0">
          <button type="button" class="flex items-center gap-2.5 group focus:outline-none text-left">
            <div
              class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-500 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/20 group-hover:scale-105 transition-transform">
              <!-- Gamepad2 Icon -->
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-gamepad-2 preview-icon w-5 h-5 text-slate-950 font-bold">
                <line x1="6" x2="10" y1="11" y2="11" />
                <line x1="8" x2="8" y1="9" y2="13" />
                <line x1="15" x2="15.01" y1="12" y2="12" />
                <line x1="18" x2="18.01" y1="10" y2="10" />
                <path
                  d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" />
              </svg>
            </div>

            <div class="flex items-center gap-2">
              <span
                class="font-display font-extrabold text-lg lg:text-xl tracking-tight text-white flex items-center gap-1.5">
                KUJI <span class="text-amber-400">//</span> APEX
              </span>
            </div>

            <!-- TODO: Add condition to reflect if Creator or Not Creator-->
            <span
              class="bg-amber-400/10 text-amber-300 border border-amber-400/30 text-[10px] font-mono font-bold tracking-wider px-2 py-0.5 rounded uppercase">
              Creator
            </span>
          </button>
        </div>

        <!-- Global Search Bar-->
        <div class="hidden md:flex items-center flex-1 max-w-md mx-2">
          <div class="relative w-full">
            <!-- Search Icon-->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-search preview-icon w-4 h-4 text-late-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none">
              <path d="m21 21-4.34-4.34" />
              <circle cx="11" cy="11" r="8" />
            </svg>
            <input type="search" placeholder="Search games, creators, tags..."
              class="w-full bg-[#111724] border border-slate-700/60 rounded-lg pl-9 pr-8 py-1.5 text-xs text-slate-200 placeholder-slate-400 focus:outline-none focus:border-amber-500/80 focus:ring-1 focus:ring-amber-500/50 transition-all">
            <kbd
              class="hidden sm:inline-block absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 font-mono bg-slate-800/80 px-1.5 py-0.5 rounded border border-slate-700/50">/</kbd>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="flex items-center gap-1 lg:gap-2">
          <button
            class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all flex items-center gap-1.5 whitespace-nowrap"
            :class="activeTab === 'marketplace' ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30 shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-800/50'"
            @click="activeTab = 'marketplace'">
            Marketplace
          </button>
          <button
            class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all flex items-center gap-1.5 whitespace-nowrap"
            :class="activeTab === 'arena' ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30 shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-800/50'"
            @click="activeTab = 'arena'">
            Arena
          </button>
          <button
            class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all flex items-center gap-1.5 whitespace-nowrap"
            :class="activeTab === 'vault' ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30 shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-800/50'"
            @click="activeTab = 'vault'">
            My Vault
          </button>
        </nav>

        <!-- TODO: Only show if user is creator or host -->
        <!-- Studio Dropdown -->
        <div class="relative">
          <button
            class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all flex items-center gap-1.5 whitespace-nowrap"
            :class="activeTab === 'creator' || activeTab === 'host' ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30 shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-800/50'"
            @click="isStudioOpen = !isStudioOpen">
            <span>Studio</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-chevron-down preview-icon w-3 h-3 opacity-70">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>

          <template x-if="isStudioOpen">
            <div
              class="absolute right-0 mt-2 w-56 bg-[#111726] border border-slate-700/80 rounded-xl shadow-2xl py-1.5 z-50 backdrop-blur-xl animate-in fade-in zoom-in-95 duration-100"
              @mouseleave="isStudioOpen = false">
              <div
                class="px-3 py-1.5 text-[10px] font-mono font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-800">
                Creator & Operator Suites
              </div>
              <button
                class="w-full text-left px-3 py-2 text-xs flex items-center gap-2 hover:bg-slate-800/60 transition-colors"
                :class="activeTab === 'creator' ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30 shadow-sm' : 'text-slate-200'"
                @click="activeTab = 'creator'">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-sliders-horizontal preview-icon w-3.5 h-3.5 text-amber-400">
                  <path d="M10 5H3" />
                  <path d="M12 19H3" />
                  <path d="M14 3v4" />
                  <path d="M16 17v4" />
                  <path d="M21 12h-9" />
                  <path d="M21 19h-5" />
                  <path d="M21 5h-7" />
                  <path d="M8 10v4" />
                  <path d="M8 12H3" />
                </svg>
                <div>
                  <div class="font-medium">Kuji Box Creator</div>
                  <div class="text-[10px] text-slate-400">一番くじ ビルダー (Draft V2.4)</div>
                </div>
              </button>
              <button
                class="w-full text-left px-3 py-2 text-xs flex items-center gap-2 hover:bg-slate-800/60 transition-colors"
                :class="activeTab === 'host' ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30 shadow-sm' : 'text-slate-200'"
                @click="activeTab = 'host'">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-radio preview-icon w-3.5 h-3.5 text-cyan-400">
                  <path d="M16.247 7.761a6 6 0 0 1 0 8.478" />
                  <path d="M19.075 4.933a10 10 0 0 1 0 14.134" />
                  <path d="M4.925 19.067a10 10 0 0 1 0-14.134" />
                  <path d="M7.753 16.239a6 6 0 0 1 0-8.478" />
                  <circle cx="12" cy="12" r="2" />
                </svg>
                <div>
                  <div class="font-medium">Host & Dispatch Hub</div>
                  <div class="text-[10px] text-slate-400">Live Engine & Shipping Station</div>
                </div>
              </button>
            </div>
          </template>
        </div>
      </div>
    </header>
    {% block content %}{% endblock %}
  </main>

  {% block extra_js %}{% endblock %}
</body>

</html>
